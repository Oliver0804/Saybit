[package]
name = "saybit-desktop"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "saybit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
enigo = { version = "0.2", features = ["serde"] }
window-vibrancy = "0.5"
tauri-plugin-http = "2.5.9"
whisper-rs = "0.16.0"
reqwest = { version = "0.13.4", features = ["stream"] }
futures-util = "0.3.32"

tauri-plugin-autostart = "2"

# 串流 STT：WebSocket 必須放 Rust —— 阿里雲的認證走 handshake header，
# 瀏覽器的 WebSocket API 設不了自訂 header。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# saybit:// URL scheme。Windows/Linux 開 URL 會啟動新程序，single-instance 把 URL
# 轉交給已開的實例（deep-link feature 讓它自動觸發 on_open_url）。
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# 檔案轉錄的音訊解碼（m4a / mp3 / wav / aiff / mp4·mov 音軌），純 Rust 不需系統 codec
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "alac",
    "flac",
    "pcm",
    "wav",
    "aiff",
    "isomp4",
] }

# 開檔／存檔對話框（檔案轉錄選檔、逐字稿存檔）。刻意不加 fs plugin：寫檔只走
# write_text_file，且只接受剛由 save_text_file_dialog 選出的路徑。
tauri-plugin-dialog = "2"

# 前景視窗查詢與系統金鑰庫：各平台走各自的原生 API
# （見 src/platform.rs、src/secure_store.rs）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSCalendar",
    "NSError",
    "NSISO8601DateFormatter",
    "NSFormatter",
    "NSLocale",
] }
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKReminder",
    "EKCalendar",
    "EKCalendarItem",
    "EKObject",
    "EKTypes",
] }
objc2-speech = { version = "0.3", features = [
    "SFSpeechRecognizer",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFTranscription",
] }
objc2-avf-audio = "0.3"
block2 = "0.6"
keyring = { version = "4", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
# SenseVoice：Linux 走動態 .so（靜態庫非 PIC，跟 cdylib 輸出衝突）。sherpa-rs-sys 會把
# libsherpa-onnx-c-api.so / libonnxruntime.so 複製到 target/<profile>/；打包見 tauri.linux.conf.json、rpath 見 build.rs
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }

# SenseVoice 離線辨識（src/sherpa_stt.rs、src/file_transcribe.rs）。
# 用 sherpa-onnx 官方預編譯的靜態庫（download-binaries + static），不需 cmake、也不用另外打包 dylib/dll。
# Linux 另見上方 cfg(target_os = "linux") 區段（動態庫）。
# Windows 的預編譯庫是 /MT（靜態 CRT），所以 .cargo/config.toml 對 msvc 開 +crt-static 讓 whisper.cpp 一致。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "static"] }

# 錄音時降低系統音量（src/audio_duck.rs）：IAudioEndpointVolume
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
