name: Release Saybit Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './saybit-desktop/src-tauri -> target'

      - name: Install Frontend Dependencies
        working-directory: ./saybit-desktop
        run: npm ci

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './saybit-desktop'
          tagName: 'desktop-${{ github.ref_name }}'
          releaseName: 'Saybit Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## Saybit Desktop 跨平台版本

            ### 下載指南
            | 平台 | 檔案 |
            |------|------|
            | **Windows** | `.msi` 或 `.exe` |
            | **macOS (Apple Silicon)** | `aarch64.dmg` |
            | **macOS (Intel)** | `x64.dmg` |
            | **Linux** | `.deb` 或 `.AppImage` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
