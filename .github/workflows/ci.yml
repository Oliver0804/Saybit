name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Project deployment target 是 macOS 26.2 (Tahoe)，但 GitHub 目前只有 macos-15 runner，
# SDK 最高 15.5.99。CI 用 MACOSX_DEPLOYMENT_TARGET=15.0 override，僅供編譯與測試驗證；
# 實際發行版本仍以 Xcode 專案設定為準。
env:
  CI_DEPLOYMENT_TARGET: "15.0"

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=$CI_DEPLOYMENT_TARGET \
            build | xcbeautify --renderer github-actions

      # 只跑單元測試。Saybit 是 LSUIElement = YES 的 menu bar app，
      # 在 headless runner 上 host app 無法正常 foreground，XCTest runner
      # 會卡在 "Test runner never began executing tests after launching"。
      # 為了 CI 能跑：override INFOPLIST_KEY_LSUIElement=NO（僅影響 CI build）。
      - name: Test (unit only)
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:speakertpyerTests \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=$CI_DEPLOYMENT_TARGET \
            INFOPLIST_KEY_LSUIElement=NO \
            test | xcbeautify --renderer github-actions
