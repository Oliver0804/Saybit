name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Project deployment target 是 macOS 26.2 (Tahoe)，但 GitHub 目前只有 macos-15 runner，
# SDK 最高 15.5.99。CI 用 MACOSX_DEPLOYMENT_TARGET=15.0 override，僅供編譯與測試驗證；
# 實際發行版本仍以 Xcode 專案設定為準。
env:
  CI_DEPLOYMENT_TARGET: "15.0"

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=$CI_DEPLOYMENT_TARGET \
            build | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MACOSX_DEPLOYMENT_TARGET=$CI_DEPLOYMENT_TARGET \
            test | xcbeautify --renderer github-actions
