name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve dependencies
        run: |
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -resolvePackageDependencies

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions || true

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project speakertpyer.xcodeproj \
            -scheme Saybit \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test | xcbeautify --renderer github-actions || true
